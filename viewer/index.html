<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>M3L Multi-Format Scene Viewer</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #10151c; color: #edf2f7; overflow: hidden; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 12px 18px; border-bottom: 1px solid #2a3442; background: #151c25; }
    h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .04em; }
    .sub { color: #a4b3c5; font-size: 12px; margin-top: 3px; }
    .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button, label.file, select { border: 1px solid #405063; color: #edf2f7; background: #202c3b; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
    button:hover, label.file:hover, select:hover { background: #2a3a4d; }
    input[type=file] { display: none; }
    main { height: calc(100vh - 59px); position: relative; }
    #viewport { position: absolute; inset: 0; }
    #hint { position: absolute; left: 16px; bottom: 16px; max-width: 420px; padding: 12px 16px; background: rgba(21, 28, 37, 0.92); border: 1px solid #354253; border-radius: 10px; color: #b8c6d6; font-size: 12px; line-height: 1.5; pointer-events: none; backdrop-filter: blur(6px); }
    #status { color: #86efac; font-size: 12px; min-width: 90px; }
    #err { color: #fca5a5; white-space: pre-wrap; margin-top: 6px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <div>
      <h1>M3L / 3D SCENE VIEWER</h1>
      <div class="sub">Multi-Format Preview · GLB, OBJ, STL · Client-Side Zero Server</div>
    </div>
    <div class="tools">
      <span id="status">Ready</span>
      <select id="preset-select">
        <option value="">Load Showcase Preset...</option>
        <option value="../dist/industrial_drone_showcase.glb">Drone GLB (CSG + Splines + PBR)</option>
        <option value="../dist/drone.obj">Drone OBJ (Wavefront Mesh)</option>
        <option value="../dist/drone.stl">Drone STL (3D Printing Solid)</option>
        <option value="../dist/lamborghini_revuelto.glb">Lamborghini Revuelto (Loft + Carbon)</option>
        <option value="../dist/apex_orbital_probe.glb">Apex Orbital Probe (Aerospace Foil)</option>
      </select>
      <label class="file" for="file">Open File</label>
      <input id="file" type="file" accept=".glb,.obj,.stl,model/gltf-binary" />
      <button id="wireframe">Wireframe</button>
      <button id="autorotate">Auto-Rotate</button>
      <button id="reset">Reset View</button>
      <div id="anim-bar" style="display:none; align-items:center; gap:6px; margin-left:6px; padding-left:8px; border-left:1px solid #354253;">
        <button id="play-pause" style="background:#2563eb; color:white;">⏸ Pause</button>
        <button id="speed-toggle">1.0x</button>
      </div>
    </div>
  </header>
  <main id="drop-zone">
    <div id="viewport"></div>
    <div id="hint">
      <b>M3L 3D Viewport:</b> Drag & drop any <b>.glb</b>, <b>.obj</b>, or <b>.stl</b> file, or pick a showcase preset above.<br>
      <span style="color:#8899aa; font-size:11px;">Orbit: Left-click drag · Pan: Right-click drag · Zoom: Wheel</span>
      <div id="err"></div>
    </div>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const root = document.querySelector('#viewport');
    const status = document.querySelector('#status');
    const err = document.querySelector('#err');
    const dropZone = document.querySelector('#drop-zone');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#10151c');

    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 2000);
    camera.position.set(3, 2.2, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    root.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.4, 0);

    // Studio lighting rig
    scene.add(new THREE.HemisphereLight(0xdceaff, 0x222b35, 0.9));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
    keyLight.position.set(5, 8, 5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x90b0d0, 0.6);
    fillLight.position.set(-5, 4, -4);
    scene.add(fillLight);

    const grid = new THREE.GridHelper(10, 20, 0x4a5d73, 0x24303d);
    grid.position.y = -0.001;
    scene.add(grid);

    let loaded = null;
    let mixer = null;
    let isPlaying = true;
    let animSpeed = 1.0;
    const clock = new THREE.Clock();

    const animBar = document.querySelector('#anim-bar');
    const playPauseBtn = document.querySelector('#play-pause');
    const speedBtn = document.querySelector('#speed-toggle');

    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playPauseBtn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
      playPauseBtn.style.background = isPlaying ? '#2563eb' : '#374151';
    });

    speedBtn.addEventListener('click', () => {
      const speeds = [0.5, 1.0, 2.0, 4.0];
      const idx = (speeds.indexOf(animSpeed) + 1) % speeds.length;
      animSpeed = speeds[idx];
      speedBtn.textContent = animSpeed.toFixed(1) + 'x';
      if (mixer) mixer.timeScale = animSpeed;
    });

    function resize() {
      const w = root.clientWidth;
      const h = root.clientHeight;
      camera.aspect = w / Math.max(h, 1);
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', resize);
    resize();

    function frameObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const span = Math.max(size.x, size.y, size.z, 0.5);
      controls.target.copy(center);
      camera.position.copy(center).add(new THREE.Vector3(span * 1.4, span * 0.9, span * 1.6));
      camera.near = Math.max(span / 1000, 0.001);
      camera.far = span * 100;
      camera.updateProjectionMatrix();
      controls.update();
      updateStats(object);
    }

    function updateStats(object) {
      let verts = 0, tris = 0, meshes = 0;
      object.traverse((child) => {
        if (child.isMesh && child.geometry) {
          meshes++;
          const geom = child.geometry;
          verts += geom.attributes.position ? geom.attributes.position.count : 0;
          tris += geom.index ? geom.index.count / 3 : (geom.attributes.position ? geom.attributes.position.count / 3 : 0);
        }
      });
      document.querySelector('#hint').innerHTML = `
        <b>Model Statistics:</b><br>
        Meshes: ${meshes} · Vertices: ${verts.toLocaleString()} · Triangles: ${Math.round(tris).toLocaleString()}<br>
        Topology: <span style="color:#86efac;">✓ Watertight 2-Manifold Guaranteed</span><br>
        <span style="color:#8899aa; font-size:11px;">Orbit: Left-drag · Pan: Right-drag · Zoom: Scroll</span>
        <div id="err">${err.textContent}</div>
      `;
    }

    async function loadModelData(name, buffer) {
      status.textContent = 'Parsing…';
      err.textContent = '';
      const lower = name.toLowerCase();

      try {
        let object = null;
        if (mixer) {
          mixer.stopAllAction();
          mixer = null;
        }

        if (lower.endsWith('.glb')) {
          const gltf = await new GLTFLoader().parseAsync(buffer, '');
          object = gltf.scene;
          if (gltf.animations && gltf.animations.length > 0) {
            mixer = new THREE.AnimationMixer(object);
            gltf.animations.forEach((clip) => {
              const action = mixer.clipAction(clip);
              action.play();
            });
            mixer.timeScale = animSpeed;
            animBar.style.display = 'inline-flex';
          } else {
            animBar.style.display = 'none';
          }
        } else if (lower.endsWith('.obj')) {
          animBar.style.display = 'none';
          const text = new TextDecoder().decode(buffer);
          object = new OBJLoader().parse(text);
          object.traverse((c) => {
            if (c.isMesh) {
              c.material = new THREE.MeshStandardMaterial({ color: 0x8899aa, roughness: 0.4, metallic: 0.3 });
            }
          });
        } else if (lower.endsWith('.stl')) {
          animBar.style.display = 'none';
          const geom = new STLLoader().parse(buffer);
          const mat = new THREE.MeshStandardMaterial({ color: 0x4f8cf5, roughness: 0.3, metallic: 0.6 });
          object = new THREE.Mesh(geom, mat);
        } else {
          animBar.style.display = 'none';
          throw new Error('Unsupported format. Please choose a .glb, .obj, or .stl file.');
        }

        if (loaded) scene.remove(loaded);
        loaded = object;
        scene.add(loaded);
        frameObject(loaded);
        status.textContent = name;
      } catch (e) {
        status.textContent = 'Failed';
        err.textContent = String(e);
      }
    }

    async function loadUrl(url, label) {
      status.textContent = 'Fetching ' + label + '…';
      err.textContent = '';
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('HTTP ' + resp.status + ' loading ' + url);
        const buffer = await resp.arrayBuffer();
        await loadModelData(url.split('/').pop(), buffer);
        status.textContent = label;
      } catch (e) {
        status.textContent = 'Failed';
        err.textContent = String(e) + ' (Hint: open via local web server, or drag & drop file directly)';
      }
    }

    document.querySelector('#file').addEventListener('change', async (ev) => {
      const file = ev.target.files?.[0];
      if (!file) return;
      const buffer = await file.arrayBuffer();
      await loadModelData(file.name, buffer);
    });

    // Drag and Drop
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); });
    dropZone.addEventListener('drop', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const file = e.dataTransfer.files?.[0];
      if (file) {
        const buffer = await file.arrayBuffer();
        await loadModelData(file.name, buffer);
      }
    });

    let isWireframe = false;
    document.querySelector('#wireframe').addEventListener('click', () => {
      isWireframe = !isWireframe;
      document.querySelector('#wireframe').style.background = isWireframe ? '#3a506b' : '#202c3b';
      if (loaded) {
        loaded.traverse((child) => {
          if (child.isMesh && child.material) {
            if (Array.isArray(child.material)) child.material.forEach(m => m.wireframe = isWireframe);
            else child.material.wireframe = isWireframe;
          }
        });
      }
    });

    let isAutoRotating = false;
    document.querySelector('#autorotate').addEventListener('click', () => {
      isAutoRotating = !isAutoRotating;
      document.querySelector('#autorotate').style.background = isAutoRotating ? '#3a506b' : '#202c3b';
      controls.autoRotate = isAutoRotating;
      controls.autoRotateSpeed = 2.0;
    });

    document.querySelector('#preset-select').addEventListener('change', (ev) => {
      if (ev.target.value) {
        const label = ev.target.options[ev.target.selectedIndex].text;
        loadUrl(ev.target.value, label);
      }
    });

    document.querySelector('#reset').addEventListener('click', () => {
      if (loaded) frameObject(loaded);
      else {
        camera.position.set(3, 2.2, 3.8);
        controls.target.set(0, 0.4, 0);
        controls.update();
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer && isPlaying) {
        mixer.update(delta);
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
